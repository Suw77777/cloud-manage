name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build CLI
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o cloud-manage .
